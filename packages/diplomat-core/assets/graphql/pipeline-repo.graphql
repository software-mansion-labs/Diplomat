# Everything a pipeline sync reads of one repository, each operation named by `gh api
# graphql -f operationName=<name>`. `Repo` reads its default branch and merge methods, the
# first page of its open issues and PRs, and its recently merged or closed PRs
# (`PipelineRead.github` keeps the ones carrying a pipeline label, and the closed issues
# of this repository they close); `Issues` and `PullRequests` read the next pages, newest
# created first so an item updated meanwhile keeps its place; `PullRequest` reads one PR
# again, with `Gate`, right before Diplomat marks it ready or merges it. `files` needs to
# see more than `floor.maxFiles` only to know a PR exceeds it, which `changedFiles` says;
# any other `totalCount` past what a connection lists reads as whatever holds the item
# back: a label, an unresolved thread, a reviewer or a commit nobody saw.

fragment Issue on Issue {
  number id title body url updatedAt
  author { login }
  assignees(first: 10) { nodes { login } }
  labels(first: 100) { totalCount nodes { name } }
  parent { url }
  subIssues(first: 50) { nodes { url } }
}

fragment PR on PullRequest {
  number title body url updatedAt state isDraft isCrossRepository mergeable reviewDecision
  headRefName headRefOid baseRefName changedFiles
  author { login }
  labels(first: 100) { totalCount nodes { name } }
  closingIssuesReferences(first: 10) {
    totalCount
    nodes { number url state assignees(first: 10) { totalCount nodes { login } } }
  }
  files(first: 20) { nodes { path additions deletions changeType } }
  tip: commits(last: 1) { nodes { commit { oid statusCheckRollup { state } } } }
  reviewRequests(first: 1) { totalCount }
  reviewThreads(first: 50) { totalCount nodes { isResolved } }
  reviews(last: 40) { totalCount nodes { author { __typename login } body commit { oid } } }
  comments(last: 40) { totalCount nodes { author { __typename login } body } }
}

# What only a PR about to be marked ready or merged is read for: its head's checks, every
# commit's author and committer, and when it last went from draft to ready.
fragment Gate on PullRequest {
  gateTip: commits(last: 1) {
    nodes {
      commit {
        statusCheckRollup {
          contexts(first: 100) {
            totalCount
            nodes {
              ... on CheckRun { conclusion startedAt }
              ... on StatusContext { state createdAt }
            }
          }
        }
      }
    }
  }
  commits(first: 100) {
    totalCount
    nodes { commit { author { name user { login } } committer { name email user { login } } } }
  }
  readied: timelineItems(last: 1, itemTypes: [READY_FOR_REVIEW_EVENT]) {
    nodes { ... on ReadyForReviewEvent { createdAt } }
  }
}

query Repo($owner: String!, $name: String!) {
  repository(owner: $owner, name: $name) {
    defaultBranchRef { name }
    squashMergeAllowed mergeCommitAllowed rebaseMergeAllowed
    issues(states: OPEN, first: 100, orderBy: {field: CREATED_AT, direction: DESC}) {
      pageInfo { hasNextPage endCursor }
      nodes { ...Issue }
    }
    pullRequests(states: OPEN, first: 50, orderBy: {field: CREATED_AT, direction: DESC}) {
      pageInfo { hasNextPage endCursor }
      nodes { ...PR }
    }
    done: pullRequests(states: [MERGED, CLOSED], first: 20, orderBy: {field: UPDATED_AT, direction: DESC}) {
      nodes {
        number title url updatedAt state isCrossRepository headRefName baseRefName
        author { login }
        labels(first: 100) { nodes { name } }
        closingIssuesReferences(first: 10) { nodes { number title url state } }
      }
    }
  }
}

query Issues($owner: String!, $name: String!, $after: String!) {
  repository(owner: $owner, name: $name) {
    issues(states: OPEN, first: 100, after: $after, orderBy: {field: CREATED_AT, direction: DESC}) {
      pageInfo { hasNextPage endCursor }
      nodes { ...Issue }
    }
  }
}

query PullRequests($owner: String!, $name: String!, $after: String!) {
  repository(owner: $owner, name: $name) {
    pullRequests(states: OPEN, first: 50, after: $after, orderBy: {field: CREATED_AT, direction: DESC}) {
      pageInfo { hasNextPage endCursor }
      nodes { ...PR }
    }
  }
}

query PullRequest($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    defaultBranchRef { name }
    pullRequest(number: $number) { ...PR ...Gate }
  }
}
