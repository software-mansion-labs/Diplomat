# Every Linear operation the pipeline sends, each by its `operationName`. Checked against
# Linear's published SDK schema (packages/sdk/src/schema.graphql).

# The operator, and one page of the tracked teams' issues not completed or canceled,
# newest-updated first. Every connection names its page size: Linear counts an unsized
# one as 50, and rejects a query whose complexity passes 10,000 (a property 0.1, an
# object 1, a connection its page size times what each node holds). This one is ~5,800.
query Issues($teams: [String!], $after: String) {
  viewer { id name }
  issues(first: 100, after: $after, orderBy: updatedAt,
         filter: { team: { key: { in: $teams } }, state: { type: { nin: ["completed", "canceled"] } } }) {
    pageInfo { hasNextPage endCursor }
    nodes {
      id identifier title description url updatedAt
      state { type name }
      assignee { id name }
      creator { name }
      labels(first: 20) { pageInfo { hasNextPage } nodes { id name } }
      parent { url }
      children(first: 10) { nodes { url } }
      attachments(first: 10) { pageInfo { hasNextPage } nodes { url } }
      team { id key }
    }
  }
}

# One issue as it is now, by its id or its identifier: read right before Diplomat writes to
# it, and for each issue a PR about to merge would close. ~60.
query Issue($id: String!) {
  issue(id: $id) {
    id identifier title description url updatedAt
    state { type name }
    assignee { id name }
    creator { name }
    labels(first: 20) { pageInfo { hasNextPage } nodes { id name } }
    parent { url }
    children(first: 10) { nodes { url } }
    attachments(first: 10) { pageInfo { hasNextPage } nodes { url } }
    team { id key }
  }
}

# Up to 100 issues by their ids, as they are now: the ones a sync is about to ask a fix for,
# read again right before it does. ~5,800.
query Recheck($ids: [ID!]) {
  issues(first: 100, filter: { id: { in: $ids } }) {
    nodes {
      id identifier title description url updatedAt
      state { type name }
      assignee { id name }
      creator { name }
      labels(first: 20) { pageInfo { hasNextPage } nodes { id name } }
      parent { url }
      children(first: 10) { nodes { url } }
      attachments(first: 10) { pageInfo { hasNextPage } nodes { url } }
      team { id key }
    }
  }
}

# The issues of any team an attachment links `url` (a PR) from, with their state: Linear
# moves a linked issue when the PR merges.
query Attached($url: String!) {
  attachmentsForURL(url: $url, first: 50) {
    pageInfo { hasNextPage }
    nodes { issue { identifier state { type } } }
  }
}

# The labels named `names`, with the team each belongs to (none for a workspace label).
query Labels($names: [String!]) {
  issueLabels(first: 50, filter: { name: { in: $names } }) {
    nodes { id name team { id } }
  }
}

# A workspace label.
mutation LabelCreate($name: String!, $color: String) {
  issueLabelCreate(input: { name: $name, color: $color }) { success issueLabel { id name } }
}

mutation AddLabel($id: String!, $labelId: String!) {
  issueAddLabel(id: $id, labelId: $labelId) { success }
}

mutation RemoveLabel($id: String!, $labelId: String!) {
  issueRemoveLabel(id: $id, labelId: $labelId) { success }
}

mutation IssueCreate($teamId: String!, $title: String!, $description: String, $parentId: String) {
  issueCreate(input: { teamId: $teamId, title: $title, description: $description, parentId: $parentId }) {
    success issue { id identifier url }
  }
}
