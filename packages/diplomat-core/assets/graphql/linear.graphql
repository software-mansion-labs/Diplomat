# Every Linear operation the pipeline sends, each picked by its `operationName`. Checked
# against Linear's SDK schema (packages/sdk/src/schema.graphql).

# Every connection names its page size: Linear counts an unsized one as 50, and rejects a
# query whose complexity passes 10,000 (a property 0.1, an object 1, a connection its page
# size times what each node holds). This one is ~5,800.
query Issues($teams: [String!], $after: String) {
  viewer { id name }
  issues(first: 100, after: $after, orderBy: updatedAt,
         filter: { team: { key: { in: $teams } }, state: { type: { nin: ["completed", "canceled"] } } }) {
    pageInfo { hasNextPage endCursor }
    nodes {
      id identifier title description url updatedAt
      state { type name }
      assignee { id name }
      creator { id name }
      labels(first: 20) { pageInfo { hasNextPage } nodes { id name } }
      parent { url }
      children(first: 10) { nodes { url } }
      attachments(first: 10) { pageInfo { hasNextPage } nodes { url } }
      team { id key }
    }
  }
}

# `$id` may be an identifier; archived issues are returned too. ~60.
query Issue($id: String!) {
  issue(id: $id) {
    id identifier title description url updatedAt archivedAt
    state { type name }
    assignee { id name }
    creator { id name }
    labels(first: 20) { pageInfo { hasNextPage } nodes { id name } }
    parent { url }
    children(first: 10) { nodes { url } }
    attachments(first: 10) { pageInfo { hasNextPage } nodes { url } }
    team { id key }
  }
}

# ~5,800.
query Recheck($ids: [ID!]) {
  issues(first: 100, filter: { id: { in: $ids } }) {
    nodes {
      id identifier title description url updatedAt
      state { type name }
      assignee { id name }
      creator { id name }
      labels(first: 20) { pageInfo { hasNextPage } nodes { id name } }
      parent { url }
      children(first: 10) { nodes { url } }
      attachments(first: 10) { pageInfo { hasNextPage } nodes { url } }
      team { id key }
    }
  }
}

# The issues queued asks wait on that `Issues` did not list, `$filter` naming each by its
# team's key and number. ~5,800.
query Queued($filter: IssueFilter!) {
  issues(first: 100, includeArchived: true, filter: $filter) {
    nodes {
      id identifier title description url updatedAt archivedAt
      state { type name }
      assignee { id name }
      creator { id name }
      labels(first: 20) { pageInfo { hasNextPage } nodes { id name } }
      parent { url }
      children(first: 10) { nodes { url } }
      attachments(first: 10) { pageInfo { hasNextPage } nodes { url } }
      team { id key }
    }
  }
}

# The issues of any team attached to `url`: a PR about to merge, which Linear moves them
# on, or a GitHub issue it would close, which they may hold.
query Attached($url: String!) {
  attachmentsForURL(url: $url, first: 50) {
    pageInfo { hasNextPage }
    nodes { issue { identifier state { type } } }
  }
}

# `team` is null for a workspace label.
query Labels($name: String!) {
  issueLabels(first: 250, filter: { name: { eqIgnoreCase: $name } }) {
    nodes { id name team { id } }
  }
}

# A workspace label.
mutation LabelCreate($name: String!, $color: String) {
  issueLabelCreate(input: { name: $name, color: $color }) { success issueLabel { id name } }
}

mutation AddLabel($id: String!, $labelId: String!) {
  issueAddLabel(id: $id, labelId: $labelId) { success }
}

mutation RemoveLabel($id: String!, $labelId: String!) {
  issueRemoveLabel(id: $id, labelId: $labelId) { success }
}

mutation IssueCreate($teamId: String!, $title: String!, $description: String, $parentId: String) {
  issueCreate(input: { teamId: $teamId, title: $title, description: $description, parentId: $parentId }) {
    success issue { id identifier url }
  }
}
