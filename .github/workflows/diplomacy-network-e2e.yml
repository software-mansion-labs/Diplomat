name: Diplomacy Network end to end

# The Diplomacy Network daemon against the real docker engine on every change to it, and
# against the real Tor network on request. The forge is a stand-in throughout, and no
# model credential is given to a runner: the cases that need one print SKIP.
on:
  push:
    branches: [main]
    paths:
      - 'packages/diplomacy-network/**'
      - 'packages/daemon-core/**'
      - '.github/workflows/diplomacy-network-e2e.yml'
  pull_request:
    paths:
      - 'packages/diplomacy-network/**'
      - 'packages/daemon-core/**'
      - '.github/workflows/diplomacy-network-e2e.yml'
  workflow_dispatch:
    inputs:
      tor:
        description: Also run the suites that use the real Tor network
        type: boolean
        default: false

concurrency:
  group: diplomacy-network-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    name: Real docker · the executor, and two daemons with one job between them
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/diplomacy-network
    env:
      DN_TEST_DOCKER: real
      DN_TEST_SKIP_CLAUDE: '1'
      # Both suites use the one image; the first builds it.
      DN_TEST_KEEP_IMAGE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: docker version
      - name: The executor against the real engine
        run: node test/executor-real.mjs
      - name: Two daemons, one job, in a real container
        run: node test/e2e-real.mjs

  tor:
    name: Real Tor · the transport, and two daemons with one job between them
    if: github.event_name == 'workflow_dispatch' && inputs.tor
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/diplomacy-network
    env:
      DN_TEST_TOR: real
      # The second suite's tors start from the network directory the first one fetched.
      DN_TEST_TOR_SEED: /tmp/dn-tor-seed
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install tor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tor
          # The package starts a tor of its own; each test runs the one it needs.
          sudo systemctl disable --now tor || true
          tor --version
      - name: The transport over real onion services
        run: node test/transport-tor.mjs
      - name: Two daemons, one job, over real onion services
        run: node test/e2e-real.mjs
